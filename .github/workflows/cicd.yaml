
name: Atlas Enterprise AI CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-deployment
  cancel-in-progress: false

jobs:

  # ==========================================
  # 1. CONTINUOUS INTEGRATION
  # ==========================================

  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: |
          python -m compileall -q app worker scripts

  # ==========================================
  # 2. CONTINUOUS DELIVERY - ECR
  # ==========================================

  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest

    environment: production

    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE" .
          docker push "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  # ==========================================
  # 3. CONTINUOUS DEPLOYMENT - EC2
  # ==========================================

  continuous-deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image

    runs-on: [self-hosted, linux, x64, atlas-ec2]

    environment: production

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          IMAGE: ${{ needs.build-and-push-ecr-image.outputs.image }}
        run: |
          REGISTRY="${IMAGE%%/*}"

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS \
              --password-stdin "$REGISTRY"

      - name: Pull Docker Image
        env:
          IMAGE: ${{ needs.build-and-push-ecr-image.outputs.image }}
        run: |
          docker pull "$IMAGE"

      - name: Stop Old Container
        run: |
          docker rm -f atlas-enterprise-ai || true

      - name: Start New Container
        env:
          IMAGE: ${{ needs.build-and-push-ecr-image.outputs.image }}
        run: |
          test -f /opt/atlas/.env

          docker run -d \
            --name atlas-enterprise-ai \
            --restart unless-stopped \
            --env-file /opt/atlas/.env \
            -p 8000:8000 \
            "$IMAGE"

      - name: Verify Deployment
        run: |
          sleep 10

          if ! docker inspect \
            -f '{{.State.Running}}' \
            atlas-enterprise-ai | grep -qx true; then
            docker logs --tail 100 atlas-enterprise-ai
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 3 \
            http://127.0.0.1:8000/ \
            > /dev/null

      - name: Clean Unused Docker Images
        run: |
          docker image prune -f
